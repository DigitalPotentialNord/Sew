# Abhängigkeiten wöchentlich prüfen. Major-Updates sinnvoll begrenzt:
# npm im App-Verzeichnis plus die GitHub-Actions selbst.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    groups:
      build-toolchain:
        patterns: ['vite', '@vitejs/*', 'vitest', 'typescript', 'eslint*', '@eslint/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
