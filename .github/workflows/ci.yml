# Continuous Integration — schneller Qualitäts-Gate bei jedem Push/PR.
# Läuft auf jeden Push nach main und auf alle Pull Requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: dieser Job braucht nur Leserechte.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    # ubuntu-24.04 (noble) bewusst gepinnt: ubuntu-latest ist auf 26.04
    # (resolute) umgezogen, für das Playwrights --with-deps noch keine
    # apt-Pakete im Microsoft-Repository hat (403 Forbidden, Exit 100).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (Pinned)
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (Pinned)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dependencies installieren (gesperrt)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit-Tests
        run: npm test

      - name: Produktionsbuild
        run: npm run build

      - name: Bundle-Budget prüfen
        run: npm run size

  e2e:
    name: Abnahmetests (Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (Pinned)
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (Pinned)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dependencies installieren (gesperrt)
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Abnahmetests ausführen
        run: npx playwright test
