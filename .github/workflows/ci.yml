# Continuous Integration — schneller Qualitäts-Gate bei jedem Push/PR.
# Läuft auf jeden Push nach main und auf alle Pull Requests.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: dieser Job braucht nur Leserechte.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · Lint · Test · Build
    # ubuntu-24.04 (noble) bewusst gepinnt: ubuntu-latest ist auf 26.04
    # (resolute) umgezogen, für das Playwrights --with-deps noch keine
    # apt-Pakete im Microsoft-Repository hat (403 Forbidden, Exit 100).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (Pinned)
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (Pinned)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dependencies installieren (gesperrt)
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit-Tests
        run: npm test

      - name: Produktionsbuild
        run: npm run build

      - name: Bundle-Budget prüfen
        run: npm run size

  e2e:
    name: Abnahmetests (Playwright)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (Pinned)
        with:
          persist-credentials: false

      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (Pinned)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Dependencies installieren (gesperrt)
        run: npm ci

      - name: Chromium installieren
        run: npx playwright install --with-deps chromium

      - name: Abnahmetests ausführen
        run: npx playwright test

      - name: Fehlgeschlagene Tests als Annotationen melden
        if: always()
        working-directory: app
        run: |
          if [ -f test-results/results.json ]; then
            node -e "
            const r = require('./test-results/results.json');
            const all = [];
            function dig(s){
              for (const sp of s.specs) {
                for (const t of sp.tests) {
                  const attempts = t.results;
                  const last = attempts[attempts.length-1];
                  if (last.status === 'failed') {
                    all.push({title: sp.title, file: s.file||sp.file||'', err: (last.error&&last.error.message)||''});
                  }
                }
              }
              for (const sub of (s.suites||[])) dig(sub);
            }
            r.suites.forEach(dig);
            console.log('PW_STATS total=' + r.stats.total + ' passed=' + r.stats.passed + ' failed=' + r.stats.failed + ' flaky=' + r.stats.flaky);
            for (const f of all) {
              const msg = 'PWFAIL: ' + f.title + ' | ' + f.err.slice(0,300);
              console.log('::error file=' + (f.file||'playwright') + '::' + msg.replace(/\\n/g,' '));
            }
            "
          fi

      - name: Test-Ergebnisse hochladen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2 (Pinned)
        if: always()
        with:
          name: playwright-results
          path: app/test-results/
          retention-days: 14
